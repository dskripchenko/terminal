<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>body { margin: 0; font-family: sans-serif; } #box { width: 860px; height: 500px; margin: 20px; border: 1px solid #ccc; }</style>
</head>
<body>
  <div id="box"></div>
  <script type="module">
    import { Terminal, TerminalView, DARK_THEME, LIGHT_THEME } from '/dist/index.mjs'
    const term = new Terminal({ scrollback: 2000 })
    window.sent = []
    window.resized = []
    window.links = []
    term.onData((d) => window.sent.push(d))
    const view = new TerminalView(term, document.getElementById('box'), {
      onResize: (c, r) => window.resized.push([c, r]),
      onLink: (url) => window.links.push(url),
      links: [{ pattern: /[\w.\-/]+\.\w+:\d+/g, activate: (text) => window.links.push('path:' + text) }],
      theme: new URLSearchParams(location.search).has('dark') ? DARK_THEME : LIGHT_THEME,
    })
    window.term = term
    window.view = view
    window.ready = true
  </script>
</body>
</html>
